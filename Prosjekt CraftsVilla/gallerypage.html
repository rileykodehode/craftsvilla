<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/art-logo.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Galleri</title>
  </head>
  <body>
    <header>
      <div>
        <!-- Three Icons -->
        <div class="icons">
          <div>
            <img class="menu-button" src="images/Menu Icon.svg" alt="" />
          </div>
          <div>
            <img class="logo" src="images/art-logo.svg" alt="" />
          </div>
          <div>
            <img class="search-icon" src="images/Search Icon.svg" alt="" />
          </div>
        </div>

        <!-- Search Bar -->
        <div>
          <label for="search"></label>
          <input type="search" id="search" placeholder="Søk her..." />
        </div>
      </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="home-nav">
      <ul class="nav-bar">
        <li class="nav-button">
          <img src="images/Home icon.svg" alt="" />
          <p>Hjem</p>
        </li>
        <li>
          <img src="images/Register Icon.svg" alt="" />
          <p>Booking</p>
        </li>
        <li>
          <img src="images/Support icon.svg" alt="" />
          <p>Kontakt</p>
        </li>
        <li>
          <img src="images/Gallery icon.svg" alt="" />
          <p>Galleri</p>
        </li>
        <!-- This button is seperated at the end of the line. -->
        <li class="user">
          <img src="images/User Icon.svg" alt="" />
        </li>
      </ul>
    </nav>
    <main class="main-gallery">
      <h1>Velkommen</h1>
      <section class="gallery-cards-section">
        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>

        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>

        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>

        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>

        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>

        <div>
          <img class="gallery-image" src="images/painting.jpg" alt="" />
        </div>
      </section>
    </main>
    <footer class="end">
      <h4>Something to fill the void.</h4>
    </footer>
  </body>
</html>
